# Production-style compose example for smoke testing deployable containers.
# Copy the .env.example files to production env files and replace every secret
# before running this in any shared environment.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: balcona_bar
      POSTGRES_USER: balcona
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balcona -d balcona_bar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://balcona:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/balcona_bar?schema=public
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3001}
      PLATFORM_AUTH_SESSION_HOURS: "12"
      PLATFORM_ADMIN_DEV_BOOTSTRAP_ENABLED: "false"
      PLATFORM_ADMIN_BOOTSTRAP_ENABLED: "false"
      STAFF_AUTH_DEV_BOOTSTRAP_ENABLED: "false"
      CUSTOMER_ACCESS_TOKEN_HOURS: "24"
      SWAGGER_ENABLED: "false"
      JOBS_ENABLED: "true"
      # Production-safe default: do not start with the mock provider.
      # Set ONLINE_PAYMENTS_ENABLED=true + ONLINE_PAYMENT_PROVIDER=paymob|fawry only
      # after provider credentials/URLs are deliberately configured for the target.
      ONLINE_PAYMENTS_ENABLED: ${ONLINE_PAYMENTS_ENABLED:-false}
      ONLINE_PAYMENT_PROVIDER: ${ONLINE_PAYMENT_PROVIDER:-external}
      MOCK_ONLINE_PAYMENTS_ENABLED: "false"
      ONLINE_PAYMENT_CHECKOUT_BASE_URL: ${WEB_ORIGIN:-http://localhost:3001}
      ONLINE_PAYMENT_RATE_LIMIT_WINDOW_SECONDS: ${ONLINE_PAYMENT_RATE_LIMIT_WINDOW_SECONDS:-60}
      ONLINE_PAYMENT_CREATE_RATE_LIMIT_MAX: ${ONLINE_PAYMENT_CREATE_RATE_LIMIT_MAX:-6}
      ONLINE_PAYMENT_READ_RATE_LIMIT_MAX: ${ONLINE_PAYMENT_READ_RATE_LIMIT_MAX:-60}
      ONLINE_PAYMENT_STAFF_RECOVERY_RATE_LIMIT_MAX: ${ONLINE_PAYMENT_STAFF_RECOVERY_RATE_LIMIT_MAX:-10}
      ONLINE_PAYMENT_STAFF_OPERATION_RATE_LIMIT_MAX: ${ONLINE_PAYMENT_STAFF_OPERATION_RATE_LIMIT_MAX:-5}
      FAWRY_CHECKOUT_URL: ${FAWRY_CHECKOUT_URL:-}
      FAWRY_STATUS_URL: ${FAWRY_STATUS_URL:-}
      FAWRY_REFUND_URL: ${FAWRY_REFUND_URL:-}
      FAWRY_CANCEL_URL: ${FAWRY_CANCEL_URL:-}
      FAWRY_MERCHANT_CODE: ${FAWRY_MERCHANT_CODE:-}
      FAWRY_SECURE_KEY: ${FAWRY_SECURE_KEY:-}
      FAWRY_NOTIFICATION_URL: ${FAWRY_NOTIFICATION_URL:-}
      FAWRY_RETURN_URL: ${FAWRY_RETURN_URL:-}
      FAWRY_ALLOWED_RETURN_ORIGINS: ${FAWRY_ALLOWED_RETURN_ORIGINS:-}
      FAWRY_TIMEOUT_MS: ${FAWRY_TIMEOUT_MS:-10000}
      FAWRY_CHECKOUT_EXPIRATION_SECONDS: ${FAWRY_CHECKOUT_EXPIRATION_SECONDS:-900}
      FAWRY_EXPECT_LIVE: ${FAWRY_EXPECT_LIVE:-false}
      PAYMOB_API_KEY: ${PAYMOB_API_KEY:-}
      ONLINE_PAYMENT_SETTLEMENT_RECONCILIATION_ENABLED: ${ONLINE_PAYMENT_SETTLEMENT_RECONCILIATION_ENABLED:-false}
      ONLINE_PAYMENT_SETTLEMENT_RECONCILIATION_INTERVAL_SECONDS: ${ONLINE_PAYMENT_SETTLEMENT_RECONCILIATION_INTERVAL_SECONDS:-3600}
      ONLINE_PAYMENT_SETTLEMENT_RECONCILIATION_TIMEZONE: ${ONLINE_PAYMENT_SETTLEMENT_RECONCILIATION_TIMEZONE:-Africa/Cairo}
      ONLINE_PAYMENT_SETTLEMENT_RECONCILIATION_MAX_ENTRIES: ${ONLINE_PAYMENT_SETTLEMENT_RECONCILIATION_MAX_ENTRIES:-500}
      ONLINE_PAYMENT_SETTLEMENT_RECONCILIATION_MAX_SCOPES: ${ONLINE_PAYMENT_SETTLEMENT_RECONCILIATION_MAX_SCOPES:-50}
      ONLINE_PAYMENT_RECONCILIATION_ENABLED: ${ONLINE_PAYMENT_RECONCILIATION_ENABLED:-false}
      ONLINE_PAYMENT_RECONCILIATION_INTERVAL_SECONDS: ${ONLINE_PAYMENT_RECONCILIATION_INTERVAL_SECONDS:-60}
      ONLINE_PAYMENT_RECONCILIATION_STALE_SECONDS: ${ONLINE_PAYMENT_RECONCILIATION_STALE_SECONDS:-120}
      ONLINE_PAYMENT_RECONCILIATION_BATCH_SIZE: ${ONLINE_PAYMENT_RECONCILIATION_BATCH_SIZE:-25}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
    restart: unless-stopped
    env_file:
      - ./apps/web/.env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  redis_prod_data:
