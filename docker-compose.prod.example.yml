# Production-style compose example for smoke testing deployable containers.
# Copy the .env.example files to production env files and replace every secret
# before running this in any shared environment.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: balcona_bar
      POSTGRES_USER: balcona
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U balcona -d balcona_bar"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - ./apps/api/.env.production
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: postgresql://balcona:${POSTGRES_PASSWORD:-replace-me}@postgres:5432/balcona_bar?schema=public
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${WEB_ORIGIN:-http://localhost:3001}
      PLATFORM_AUTH_SESSION_HOURS: "12"
      PLATFORM_ADMIN_DEV_BOOTSTRAP_ENABLED: "false"
      PLATFORM_ADMIN_BOOTSTRAP_ENABLED: "false"
      STAFF_AUTH_DEV_BOOTSTRAP_ENABLED: "false"
      CUSTOMER_ACCESS_TOKEN_HOURS: "24"
      SWAGGER_ENABLED: "false"
      JOBS_ENABLED: "true"
      ONLINE_PAYMENTS_ENABLED: "true"
      ONLINE_PAYMENT_PROVIDER: mock
      MOCK_ONLINE_PAYMENTS_ENABLED: "false"
      ONLINE_PAYMENT_CHECKOUT_BASE_URL: ${WEB_ORIGIN:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
    restart: unless-stopped
    env_file:
      - ./apps/web/.env.production
    environment:
      NODE_ENV: production
      PORT: 3001
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  postgres_prod_data:
  redis_prod_data:
