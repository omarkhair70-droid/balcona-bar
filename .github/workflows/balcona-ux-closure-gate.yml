name: Balcona UX Closure Gate

on:
  push:
    branches:
      - ux/product-ia-overhaul
  workflow_dispatch:

concurrency:
  group: balcona-ux-closure-gate
  cancel-in-progress: true

jobs:
  ux-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Web lint
        run: pnpm --filter @balcona-bar/web lint

      - name: Web typecheck
        run: pnpm --filter @balcona-bar/web typecheck

      - name: Web production build
        run: pnpm web:build

      - name: Install Playwright
        run: |
          pnpm add -Dw playwright@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Start web
        run: |
          pnpm --filter @balcona-bar/web start > /tmp/balcona-ux.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/prototype/guest >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/balcona-ux.log
          exit 1

      - name: Run combined UX closure
        run: node scripts/balcona-ux-closure-gate.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balcona-ux-closure-gate
          path: qa-artifacts/
          if-no-files-found: error
