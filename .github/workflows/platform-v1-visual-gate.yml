name: Platform V1 Visual Gate

on:
  push:
    branches:
      - ux/platform-prototype
  workflow_dispatch:

concurrency:
  group: platform-v1-visual-gate
  cancel-in-progress: true

jobs:
  platform-v1-visual-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.1 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Web lint
        run: pnpm --filter @balcona-bar/web lint
      - name: Web typecheck
        run: pnpm --filter @balcona-bar/web typecheck
      - name: Web build
        run: pnpm web:build
      - name: Install Playwright
        run: |
          pnpm add -Dw playwright@1.55.0
          pnpm exec playwright install --with-deps chromium
      - name: Start web
        run: |
          pnpm --filter @balcona-bar/web start > /tmp/balcona-platform.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/prototype/platform >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/balcona-platform.log
          exit 1
      - name: Run Platform visual gate
        run: node scripts/platform-v1-visual-gate.mjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balcona-platform-v1-visual-gate
          path: qa-artifacts/
          if-no-files-found: error
