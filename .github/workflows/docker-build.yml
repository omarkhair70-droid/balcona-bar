name: Docker Build Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    name: Build API and Web images
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t balcona-api:${{ github.sha }} .

      - name: Build Web image
        run: >
          docker build
          -f apps/web/Dockerfile
          -t balcona-web:${{ github.sha }}
          --build-arg NEXT_PUBLIC_API_BASE_URL=http://localhost:3000/api/v1
          .
